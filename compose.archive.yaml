# Standalone Compose for a local work archive behind the existing proxy network.
# Copy archive.env.example to .env for a NEW install; preserve existing auth on upgrade.
services:
  reelshrink:
    image: ${REELSHRINK_IMAGE:-ghcr.io/kirederb-vibing/reelshrink:latest}
    container_name: reelshrink
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    stop_grace_period: 2m
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      ENCODE_THREADS: ${ENCODE_THREADS:-2}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-30}
      STABLE_SECONDS: ${STABLE_SECONDS:-60}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      WORK_ROOT: /work
      WORK_DRIVE_TYPE: ${WORK_DRIVE_TYPE:-local}
      MEDIA_ROOTS: /media/film:/media/film_2:/media/serier
      MEDIA_DRIVE_TYPES: ${FILM_DRIVE_TYPE:-network}:${FILM2_DRIVE_TYPE:-network}:${SERIES_DRIVE_TYPE:-network}
    volumes:
      - type: bind
        source: ${CONFIG_PATH:?Set CONFIG_PATH}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${WORK_PATH:?Set WORK_PATH to a local disk}
        target: /work
        bind:
          create_host_path: false
      - type: bind
        source: ${FILM_PATH:?Set FILM_PATH}
        target: /media/film
        bind:
          create_host_path: false
      - type: bind
        source: ${FILM2_PATH:?Set FILM2_PATH}
        target: /media/film_2
        bind:
          create_host_path: false
      - type: bind
        source: ${SERIES_PATH:?Set SERIES_PATH}
        target: /media/serier
        bind:
          create_host_path: false
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true
