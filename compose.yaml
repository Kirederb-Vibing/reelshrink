# Klar til kørsel: docker compose up -d
# Opretter ./config, ./work og medie-mapper, hvis de mangler.
# SMB, SFTP og S3 tilføjes i GUI'en og kræver ikke mounts her.
services:
  reelshrink:
    image: ${REELSHRINK_IMAGE:-ghcr.io/kirederb-vibing/reelshrink:latest}
    container_name: reelshrink
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    stop_grace_period: 2m
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      ENCODE_THREADS: ${ENCODE_THREADS:-2}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-30}
      STABLE_SECONDS: ${STABLE_SECONDS:-60}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      WORK_ROOT: /work
      WORK_DRIVE_TYPE: local
      MEDIA_ROOTS: /media/movies:/media/series
      MEDIA_DRIVE_TYPES: ${MOVIES_DRIVE_TYPE:-local}:${SERIES_DRIVE_TYPE:-local}
    volumes:
      - type: bind
        source: ${CONFIG_PATH:-./config}
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: ${WORK_PATH:-./work}
        target: /work
        bind:
          create_host_path: true
      - type: bind
        source: ${MOVIES_PATH:-./media/movies}
        target: /media/movies
        bind:
          create_host_path: true
      - type: bind
        source: ${SERIES_PATH:-./media/series}
        target: /media/series
        bind:
          create_host_path: true
    # GPU: fjern kommentaren, hvis maskinen har /dev/dri (Intel/AMD) eller NVIDIA-runtime.
    # devices:
    #   - /dev/dri:/dev/dri
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
