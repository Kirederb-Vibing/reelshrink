# Standalone Dockge/Pangolin configuration with write access for return-to-library.
# Keep container paths identical to the paths used by your EXISTING ReelShrink jobs.
services:
  reelshrink:
    image: ${REELSHRINK_IMAGE:-ghcr.io/kirederb-vibing/reelshrink:latest}
    container_name: reelshrink
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    stop_grace_period: 2m
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      MEDIA_ROOTS: /media
      RETURN_INPUT_ROOTS: /incoming
      ENCODE_THREADS: ${ENCODE_THREADS:-2}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-30}
      STABLE_SECONDS: ${STABLE_SECONDS:-60}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - type: bind
        source: ${CONFIG_PATH:-/srv/reelshrink/config}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${MOVIES_PATH:-/srv/media/movies}
        target: ${MOVIES_CONTAINER_PATH:-/media/movies}
        bind:
          create_host_path: false
      - type: bind
        source: ${MOVIES_2_PATH:-/srv/media/movies_2}
        target: ${MOVIES_2_CONTAINER_PATH:-/media/movies_2}
        bind:
          create_host_path: false
      - type: bind
        source: ${SERIES_PATH:-/srv/media/series}
        target: ${SERIES_CONTAINER_PATH:-/media/series}
        bind:
          create_host_path: false
      - type: bind
        source: ${OUTPUT_PATH:-/srv/reelshrink/encoded}
        target: /output
        bind:
          create_host_path: false
      - type: bind
        source: ${INCOMING_PATH:-/srv/reelshrink/incoming}
        target: /incoming
        bind:
          create_host_path: false
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true
